/*:
 * @target MZ
 * @plugindesc Teleport player to map 001 after name input (full safe override)
 * @author You
 *
 * @help
 * После подтверждения имени игрок автоматически переносится
 * на карту с ID = 001.
 * Работает поверх любых сцен выбора персонажа.
 */

(() => {

    // ================================
    // НАСТРОЙКИ ТЕЛЕПОРТА
    // ================================

    const TARGET_MAP_ID = 1;  // ← КАРТА 001
    const TARGET_X = 10;      // ← X позиция появления
    const TARGET_Y = 10;      // ← Y позиция появления
    const TARGET_DIR = 2;    // 2 = вниз, 4 = влево, 6 = вправо, 8 = вверх

    // ================================
    // ЖЁСТКИЙ ПЕРЕХВАТ ВВОДА ИМЕНИ
    // ================================

    const _Scene_Name_onInputOk = Scene_Name.prototype.onInputOk;

    Scene_Name.prototype.onInputOk = function() {

        // ✅ СНАЧАЛА стандартная логика RPG (применить имя)
        _Scene_Name_onInputOk.call(this);

        // ✅ ЗАТЕМ жёсткий перенос игрока
        $gamePlayer.reserveTransfer(
            TARGET_MAP_ID,
            TARGET_X,
            TARGET_Y,
            TARGET_DIR,
            0
        );

        // ✅ ГАРАНТИРОВАННЫЙ ПЕРЕХОД В ИГРУ, А НЕ НАЗАД В МЕНЮ
        SceneManager.goto(Scene_Map);
    };

})();
